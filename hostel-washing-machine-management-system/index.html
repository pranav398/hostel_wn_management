<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraWash | Hostel Washing Machine Management System</title>
  <!-- Google Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS & Custom Styles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <link rel="stylesheet" href="./assets/css/style.css" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased flex flex-col justify-between selection:bg-blue-500 selection:text-white relative overflow-x-hidden">

  <!-- Ambient Glow Background -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0 opacity-40 dark:opacity-20">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-400 dark:bg-blue-600 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-indigo-400 dark:bg-indigo-600 rounded-full blur-3xl"></div>
  </div>

  <!-- Minimal Header for Login Page -->
  <header class="w-full max-w-7xl mx-auto p-6 flex items-center justify-between z-10 relative">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-sky-400 flex items-center justify-center text-white shadow-lg shadow-blue-500/25">
        <i data-lucide="waves" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-lg tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
          AuraWash
          <span class="text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300">Titanium</span>
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Hostel Laundry Portal</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button class="theme-toggle-btn p-2 text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-800 rounded-xl shadow-xs border border-slate-200/80 dark:border-slate-800 transition" title="Toggle Theme">
        <i data-lucide="sun" class="theme-sun-icon w-5 h-5 hidden"></i>
        <i data-lucide="moon" class="theme-moon-icon w-5 h-5"></i>
      </button>
      <a href="about.html" class="text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-blue-600 transition hidden sm:inline-block">Hostel Guidelines</a>
    </div>
  </header>

  <!-- Login Main Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 z-10 relative">
    <div class="w-full max-w-md">
      <!-- Centered Card -->
      <div class="glass-card bg-white/90 dark:bg-slate-900/90 rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-200/80 dark:border-slate-800 backdrop-blur-xl relative overflow-hidden">
        
        <!-- Header badge & illustration icon -->
        <div class="text-center mb-8">
          <div class="w-16 h-16 rounded-2xl bg-blue-50 dark:bg-blue-950/80 border border-blue-100 dark:border-blue-900 mx-auto flex items-center justify-center text-blue-600 dark:text-blue-400 mb-4 shadow-inner">
            <i data-lucide="washing-machine" class="w-8 h-8 animate-bubble"></i>
          </div>
          <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Resident Sign In</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 max-w-xs mx-auto">Access real-time machine status, book slots, and track wash cycles.</p>
        </div>

        <!-- Login Form -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Hostel Block</label>
            <div class="relative">
              <select id="login-block" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition appearance-none">
                <option value="Titanium Block">Titanium Block (Main Campus)</option>
                <option value="Platinum Block">Platinum Block (East Wing)</option>
                <option value="Gold Block">Gold Block (South Wing)</option>
              </select>
              <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-3 pointer-events-none"></i>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Student ID or Room No.</label>
            <div class="relative">
              <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
              <input type="text" id="login-user" required value="STU20268841 (B-304)" placeholder="e.g. STU20268841 or B-304" class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Password</label>
              <a href="#" onclick="showToast('Contact hostel warden office to reset PIN', 'warning'); return false;" class="text-[11px] text-blue-600 dark:text-blue-400 hover:underline">Forgot password?</a>
            </div>
            <div class="relative">
              <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
              <input type="password" id="login-pass" required value="••••••••" placeholder="Enter password" class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
          </div>

          <div class="flex items-center justify-between text-xs py-1">
            <label class="flex items-center gap-2 cursor-pointer text-slate-600 dark:text-slate-400">
              <input type="checkbox" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
              <span>Remember this device</span>
            </label>
          </div>

          <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-xl text-xs font-bold shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2 group cursor-pointer">
            <span>Sign In to Laundry Dashboard</span>
            <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
          </button>
        </form>

        <!-- Quick Demo Switcher -->
        <div class="mt-6 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
          <p class="text-[11px] text-slate-400 mb-2 font-medium">Quick Preview Access:</p>
          <button onclick="quickLogin()" class="w-full py-2 px-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition cursor-pointer">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250" class="w-5 h-5 rounded-full object-cover">
            <span>Continue as Alex Rivera (Room B-304)</span>
          </button>
        </div>

      </div>
    </div>
  </main>

  <!-- Login Page Footer -->
  <footer class="w-full max-w-7xl mx-auto p-6 text-center text-xs text-slate-400 dark:text-slate-500 z-10 relative">
    <p>© 2026 AuraWash OS. Titanium Hostel Administration. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script src="./assets/js/theme.js"></script>
  <script src="./assets/js/main.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      showToast('Signing in as Alex Rivera...', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 800);
    }

    function quickLogin() {
      showToast('Logging in as Alex Rivera (Titanium Block B-304)...', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 600);
    }
  </script>
</body>
</html>
